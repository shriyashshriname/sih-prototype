version: "3.9"

# Development overrides — run with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Enables hot reload for client, server, and AI engine via bind mounts,
# plus debug ports.

services:
  # ─────────────────────────────────────────────
  # DB: Expose port for local tools (pgAdmin, DBeaver)
  # ─────────────────────────────────────────────
  db:
    ports:
      - "5432:5432"

  # ─────────────────────────────────────────────
  # Redis: Expose port for local inspection
  # ─────────────────────────────────────────────
  redis:
    ports:
      - "6379:6379"

  # ─────────────────────────────────────────────
  # AI Engine: Live reload via Uvicorn
  # ─────────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    volumes:
      - ./ai-engine:/app
    environment:
      ENVIRONMENT: development
      NODE_ENV: development
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  # ─────────────────────────────────────────────
  # Server: Node 20 built-in watch & inspector
  # ─────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 5000
    command: ["node", "--inspect=0.0.0.0:9229", "--watch", "index.js"]
    ports:
      - "5000:5000"
      - "9229:9229"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || wget -q -O - http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Client: Vite dev server with HMR (Port 5173)
  # ─────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || wget -q -O - http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
